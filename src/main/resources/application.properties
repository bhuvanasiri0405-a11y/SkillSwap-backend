spring.application.name=skillswap
server.port=${PORT:1234}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillswap_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:skillswap-super-secret-key-must-be-long-enough-256bits}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}